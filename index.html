<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tally - 금융 & 자산 관리 V2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes highlight {
      0% { background-color: #fef08a; transform: scale(1.02); }
      100% { background-color: #ffffff; transform: scale(1); }
    }
    .highlight-card {
      animation: highlight 2s ease-out;
    }
    /* Mobile safe area padding for iOS */
    .safe-pb {
      padding-bottom: calc(4rem + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 safe-pb min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 text-white p-2 rounded-xl text-lg font-bold">
        <i class="fa-solid me-1 fa-wallet"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-900 leading-tight">Tally v2</h1>
        <p class="text-xs text-gray-500">스마트 자산 & 금융 미션 관리</p>
      </div>
    </div>
    <button onclick="resetDataConfirm()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-lg border">
      <i class="fa-solid fa-rotate-left mr-1"></i>초기화
    </button>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main id="app-content" class="flex-1 p-4 max-w-3xl mx-auto w-full">
    <!-- 탭 1: 대시보드 -->
    <section id="tab-dashboard" class="space-y-4">
      <!-- 종합 현황 요약 -->
      <div class="grid grid-cols-2 gap-3">
        <div onclick="switchTab('assets')" class="bg-gradient-to-br from-indigo-500 to-indigo-600 text-white p-4 rounded-2xl shadow-sm cursor-pointer hover:opacity-95 transition">
          <p class="text-xs opacity-80 mb-1">총 자산 현황</p>
          <h2 id="dash-total-assets" class="text-xl font-bold">0 원</h2>
          <div class="mt-2 text-xs opacity-90 flex justify-between items-center">
            <span>계좌/통장 관리</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </div>
        </div>
        <div onclick="switchTab('savings')" class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow-sm cursor-pointer hover:opacity-95 transition">
          <p class="text-xs opacity-80 mb-1">총 적금 약정액</p>
          <h2 id="dash-total-savings" class="text-xl font-bold">0 원</h2>
          <div class="mt-2 text-xs opacity-90 flex justify-between items-center">
            <span>적금 트래커</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </div>
        </div>
      </div>

      <!-- 우대금리 미션 방어 센터 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="bg-amber-100 text-amber-700 p-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-shield-halved"></i></span>
            <h3 class="font-bold text-gray-900 text-sm">우대금리 미션 방어</h3>
          </div>
          <button onclick="openMissionModal()" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 px-2.5 py-1.2 rounded-lg font-medium border border-amber-200">
            <i class="fa-solid fa-plus mr-1"></i>미션 추가
          </button>
        </div>
        <p class="text-xs text-gray-500 mb-3">미션을 터치하면 해당 적금으로 바로 이동합니다.</p>
        <div id="mission-list" class="space-y-2">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 다가오는 주요 금융 일정 (자동 연동) -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="bg-blue-100 text-blue-700 p-1.5 rounded-lg text-xs font-bold"><i class="fa-regular fa-calendar-check"></i></span>
            <h3 class="font-bold text-gray-900 text-sm">다가오는 연동 금융 일정</h3>
          </div>
          <button onclick="switchTab('calendar')" class="text-xs text-indigo-600 font-medium">달력 보기 <i class="fa-solid fa-angle-right"></i></button>
        </div>
        <div id="dash-upcoming-events" class="space-y-2">
          <!-- JS 렌더링 -->
        </div>
      </div>
    </section>

    <!-- 탭 2: 적금 관리 -->
    <section id="tab-savings" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-gray-900">적금 목록 & 트래커</h2>
        <button onclick="openSavingsModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-medium shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i>적금 등록
        </button>
      </div>

      <div id="savings-list" class="space-y-3">
        <!-- JS 렌더링 -->
      </div>
    </section>

    <!-- 탭 3: 금융 달력 -->
    <section id="tab-calendar" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <button onclick="changeMonth(-1)" class="p-2 bg-white rounded-xl border text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="calendar-month-title" class="text-base font-bold text-gray-900">2026년 9월</span>
          <button onclick="changeMonth(1)" class="p-2 bg-white rounded-xl border text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <button onclick="openCalendarModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-medium shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i>일정 직접 추가
        </button>
      </div>

      <!-- 달력 그리드 -->
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-gray-400 mb-2">
          <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 선택일 / 종합 일정 목록 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 id="selected-date-title" class="text-sm font-bold text-gray-900 mb-3">등록 및 연동된 금융 일정</h3>
        <div id="calendar-event-list" class="space-y-2">
          <!-- JS 렌더링 -->
        </div>
      </div>
    </section>

    <!-- 탭 4: 자산/통장 -->
    <section id="tab-assets" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-gray-900">보유 통장 및 계좌</h2>
        <button onclick="openAccountModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-medium shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i>계좌 등록
        </button>
      </div>
      <div id="account-list" class="space-y-2">
        <!-- JS 렌더링 -->
      </div>
    </section>
  </main>

  <!-- 하단 고정 탭 바 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 px-2 py-2 shadow-lg">
    <div class="max-w-3xl mx-auto grid grid-cols-4 gap-1 text-center text-xs">
      <button id="nav-dashboard" onclick="switchTab('dashboard')" class="py-1.5 text-indigo-600 font-bold flex flex-col items-center">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
        <span>대시보드</span>
      </button>
      <button id="nav-savings" onclick="switchTab('savings')" class="py-1.5 text-gray-400 hover:text-gray-600 flex flex-col items-center">
        <i class="fa-solid fa-piggy-bank text-lg mb-0.5"></i>
        <span>적금 관리</span>
      </button>
      <button id="nav-calendar" onclick="switchTab('calendar')" class="py-1.5 text-gray-400 hover:text-gray-600 flex flex-col items-center">
        <i class="fa-solid fa-calendar-days text-lg mb-0.5"></i>
        <span>금융 달력</span>
      </button>
      <button id="nav-assets" onclick="switchTab('assets')" class="py-1.5 text-gray-400 hover:text-gray-600 flex flex-col items-center">
        <i class="fa-solid fa-vault text-lg mb-0.5"></i>
        <span>통장/자산</span>
      </button>
    </div>
  </nav>

  <!-- 모달 1: 적금 등록/수정 -->
  <div id="modal-savings" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="savings-modal-title" class="font-bold text-gray-900">적금 등록</h3>
        <button onclick="closeModal('modal-savings')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="form-savings" onsubmit="saveSavings(event)" class="space-y-3 text-xs">
        <input type="hidden" id="savings-id" />
        <div>
          <label class="block font-medium text-gray-700 mb-1">적금 상품명</label>
          <input type="text" id="savings-title" required placeholder="예: KB 특판 적금" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">월 납입금액 (원)</label>
          <input type="number" id="savings-amount" required placeholder="300000" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-gray-700 mb-1">가입일</label>
            <input type="date" id="savings-start-date" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">만기일</label>
            <input type="date" id="savings-end-date" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-gray-700 mb-1">납입 주기</label>
            <select id="savings-cycle" onchange="toggleCycleInput()" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="monthly">매월</option>
              <option value="weekly">매주</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">납입 이체 지정일</label>
            <select id="savings-pay-day" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
              <!-- JS 동적 생성 -->
            </select>
          </div>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">우대금리 미션 (기입 사항)</label>
          <textarea id="savings-mission" rows="2" placeholder="예: 매월 신한카드 10만원 사용 및 마이신한포인트 적립" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modal-savings')" class="px-4 py-2 border rounded-xl bg-gray-100 text-gray-600">취소</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-medium">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 2: 우대금리 미션 방어 등록/수정 -->
  <div id="modal-mission" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="mission-modal-title" class="font-bold text-gray-900">우대금리 미션 설정</h3>
        <button onclick="closeModal('modal-mission')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="form-mission" onsubmit="saveMission(event)" class="space-y-3 text-xs">
        <input type="hidden" id="mission-id" />
        <div>
          <label class="block font-medium text-gray-700 mb-1">연동 적금 선택</label>
          <select id="mission-savings-id" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- JS 동적 렌더링 -->
          </select>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">우대금리 미션 제목</label>
          <input type="text" id="mission-title" required placeholder="예: 매월 카드 실적 20만원 달성" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">상세 내용 및 팁</label>
          <input type="text" id="mission-desc" placeholder="예: 말일 이전 자동이체 연동 필수" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modal-mission')" class="px-4 py-2 border rounded-xl bg-gray-100 text-gray-600">취소</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-amber-600 text-white font-medium">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 3: 달력 일정 수동 추가/수정 -->
  <div id="modal-calendar" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="calendar-modal-title" class="font-bold text-gray-900">금융 일정 설정</h3>
        <button onclick="closeModal('modal-calendar')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="form-calendar" onsubmit="saveCalendarEvent(event)" class="space-y-3 text-xs">
        <input type="hidden" id="calendar-event-id" />
        <div>
          <label class="block font-medium text-gray-700 mb-1">일정 날짜</label>
          <input type="date" id="calendar-event-date" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">구분</label>
          <select id="calendar-event-type" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="expense">지출 / 이체</option>
            <option value="income">수입</option>
            <option value="memo">금융 메모/체크</option>
          </select>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">일정 이름</label>
          <input type="text" id="calendar-event-title" required placeholder="예: 공과금 납부" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">금액 (선택)</label>
          <input type="number" id="calendar-event-amount" placeholder="0" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modal-calendar')" class="px-4 py-2 border rounded-xl bg-gray-100 text-gray-600">취소</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-medium">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 4: 통장/계좌 추가/수정 -->
  <div id="modal-account" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="account-modal-title" class="font-bold text-gray-900">계좌 정보</h3>
        <button onclick="closeModal('modal-account')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="form-account" onsubmit="saveAccount(event)" class="space-y-3 text-xs">
        <input type="hidden" id="account-id" />
        <div>
          <label class="block font-medium text-gray-700 mb-1">은행/금융사</label>
          <input type="text" id="account-bank" required placeholder="예: 토스뱅크" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">계좌 별칭</label>
          <input type="text" id="account-name" required placeholder="예: 비상금 통장" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">현재 잔액 (원)</label>
          <input type="number" id="account-balance" required placeholder="0" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modal-account')" class="px-4 py-2 border rounded-xl bg-gray-100 text-gray-600">취소</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-medium">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 자바스크립트 로직 -->
  <script>
    // 앱 전역 데이터 상태 관리
    let appData = {
      savings: [],
      missions: [],
      calendarEvents: [],
      accounts: []
    };

    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth(); // 0~11
    let selectedCalDateStr = getFormattedDateStr(new Date());

    // 초기 데이터 로드 및 초기화
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      if (appData.savings.length === 0 && appData.accounts.length === 0) {
        initSampleData();
      }
      toggleCycleInput();
      renderAll();
    });

    function initSampleData() {
      appData.accounts = [
        { id: 'acc_1', bank: '신한은행', name: '주거래 통장', balance: 2500000 },
        { id: 'acc_2', bank: '토스뱅크', name: '비상금 파킹통장', balance: 5000000 }
      ];
      appData.savings = [
        {
          id: 'sav_1',
          title: '청년 희망 적금',
          amount: 500000,
          startDate: '2026-01-10',
          endDate: '2026-12-10',
          cycle: 'monthly',
          payDay: '10',
          mission: '신한 체크카드 월 20만원 이상 실적 유지',
          paidCount: 8
        }
      ];
      appData.missions = [
        {
          id: 'mis_1',
          savingsId: 'sav_1',
          title: '체크카드 실적 20만원 방어',
          desc: '매월 말일 전까지 실적 달성 여부 체크',
          completed: false
        }
      ];
      appData.calendarEvents = [
        { id: 'evt_1', date: getFormattedDateStr(new Date()), title: '카드 대금 자동이체', amount: 350000, type: 'expense' }
      ];
      saveData();
    }

    function saveData() {
      localStorage.setItem('tally_v2_data', JSON.stringify(appData));
    }

    function loadData() {
      const dataStr = localStorage.getItem('tally_v2_data');
      if (dataStr) {
        try { appData = JSON.parse(dataStr); } catch (e) { console.error(e); }
      }
    }

    function resetDataConfirm() {
      if (confirm('모든 데이터를 초기 상태로 리셋하시겠습니까?')) {
        localStorage.removeItem('tally_v2_data');
        location.reload();
      }
    }

    // Tab 전환 로직
    function switchTab(tabName) {
      ['dashboard', 'savings', 'calendar', 'assets'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const navBtn = document.getElementById(`nav-${t}`);
        navBtn.classList.remove('text-indigo-600', 'font-bold');
        navBtn.classList.add('text-gray-400');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabName}`);
      activeNav.classList.remove('text-gray-400');
      activeNav.classList.add('text-indigo-600', 'font-bold');

      renderAll();
    }

    // 전체 화면 렌더링
    function renderAll() {
      renderDashboard();
      renderSavings();
      renderCalendar();
      renderAccounts();
    }

    // 1. 대시보드 렌더링
    function renderDashboard() {
      // 자산 & 적금 합계
      const totalAssets = appData.accounts.reduce((sum, a) => sum + Number(a.balance), 0);
      const totalSavings = appData.savings.reduce((sum, s) => sum + Number(s.amount), 0);

      document.getElementById('dash-total-assets').textContent = totalAssets.toLocaleString() + ' 원';
      document.getElementById('dash-total-savings').textContent = totalSavings.toLocaleString() + ' 원';

      // 우대금리 미션 리스트
      const missionContainer = document.getElementById('mission-list');
      missionContainer.innerHTML = '';

      if (appData.missions.length === 0) {
        missionContainer.innerHTML = `<p class="text-xs text-gray-400 py-3 text-center">등록된 우대금리 미션이 없습니다.</p>`;
      } else {
        appData.missions.forEach(m => {
          const linkedSav = appData.savings.find(s => s.id === m.savingsId);
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100';
          div.innerHTML = `
            <div class="flex items-start space-x-2.5 flex-1 cursor-pointer" onclick="navigateToSavings('${m.savingsId}')">
              <button onclick="event.stopPropagation(); toggleMission('${m.id}')" class="mt-0.5 text-base">
                <i class="${m.completed ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle text-gray-300'}"></i>
              </button>
              <div>
                <h4 class="text-xs font-bold text-gray-900 ${m.completed ? 'line-through text-gray-400' : ''}">${m.title}</h4>
                <p class="text-[11px] text-gray-500">${m.desc || '미션 내용 없음'} ${linkedSav ? `<span class="text-indigo-600">(${linkedSav.title})</span>` : ''}</p>
              </div>
            </div>
            <div class="flex items-center space-x-1 pl-2 border-l ml-2">
              <button onclick="openMissionModal('${m.id}')" class="p-1 text-gray-400 hover:text-indigo-600 text-xs"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteMission('${m.id}')" class="p-1 text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          missionContainer.appendChild(div);
        });
      }

      // 다가오는 연동 금융 일정
      const upcomingContainer = document.getElementById('dash-upcoming-events');
      upcomingContainer.innerHTML = '';
      const allEvents = getCombinedEvents();
      const todayStr = getFormattedDateStr(new Date());
      const filtered = allEvents.filter(e => e.date >= todayStr).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 4);

      if (filtered.length === 0) {
        upcomingContainer.innerHTML = `<p class="text-xs text-gray-400 py-2 text-center">예정된 일정이 없습니다.</p>`;
      } else {
        filtered.forEach(e => {
          const item = document.createElement('div');
          item.className = 'flex justify-between items-center text-xs p-2.5 rounded-xl bg-gray-50';
          item.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${e.isAuto ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-200 text-gray-700'}">${e.date.slice(5)}</span>
              <span class="font-medium text-gray-800">${e.title}</span>
            </div>
            <span class="font-bold ${e.type === 'income' ? 'text-emerald-600' : 'text-gray-700'}">${e.amount ? (e.type === 'income' ? '+' : '-') + Number(e.amount).toLocaleString() + '원' : ''}</span>
          `;
          upcomingContainer.appendChild(item);
        });
      }
    }

    // 미션 클릭 시 적금 탭 이동 및 강조
    function navigateToSavings(savingsId) {
      switchTab('savings');
      setTimeout(() => {
        const targetEl = document.getElementById(`savings-card-${savingsId}`);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetEl.classList.add('highlight-card');
          setTimeout(() => targetEl.classList.remove('highlight-card'), 2000);
        }
      }, 100);
    }

    function toggleMission(missionId) {
      const m = appData.missions.find(item => item.id === missionId);
      if (m) {
        m.completed = !m.completed;
        saveData();
        renderAll();
      }
    }

    function deleteMission(missionId) {
      if (confirm('해당 미션을 삭제하시겠습니까?')) {
        appData.missions = appData.missions.filter(m => m.id !== missionId);
        saveData();
        renderAll();
      }
    }

    // 2. 적금 탭 렌더링
    function renderSavings() {
      const list = document.getElementById('savings-list');
      list.innerHTML = '';

      if (appData.savings.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-400 py-8 text-center">등록된 적금이 없습니다. 적금을 등록해 보세요!</p>`;
        return;
      }

      appData.savings.forEach(s => {
        const card = document.createElement('div');
        card.id = `savings-card-${s.id}`;
        card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-100 transition-all space-y-3';

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md font-bold">${s.cycle === 'monthly' ? '매월 ' + s.payDay + '일' : '매주 ' + getDayName(s.payDay)}</span>
              <h3 class="font-bold text-gray-900 text-sm mt-1">${s.title}</h3>
              <p class="text-xs font-bold text-indigo-600 mt-0.5">월 ${Number(s.amount).toLocaleString()} 원</p>
            </div>
            <div class="flex space-x-1">
              <button onclick="openSavingsModal('${s.id}')" class="p-1.5 text-gray-400 hover:text-indigo-600 text-xs"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteSavings('${s.id}')" class="p-1.5 text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

          <div class="bg-gray-50 rounded-xl p-2.5 text-xs text-gray-600 space-y-1">
            <div class="flex justify-between">
              <span>가입 / 만기일:</span>
              <span class="font-medium text-gray-800">${s.startDate || '-'} ~ ${s.endDate || '-'}</span>
            </div>
            ${s.mission ? `
              <div class="flex justify-between border-t border-gray-200/60 pt-1 mt-1">
                <span class="text-amber-700 font-bold"><i class="fa-solid fa-shield-halved mr-1"></i>우대미션:</span>
                <span class="font-medium text-gray-800 text-right flex-1 ml-2">${s.mission}</span>
              </div>
            ` : ''}
          </div>

          <div class="pt-1 border-t flex justify-between items-center">
            <div>
              <span class="text-xs text-gray-500">현재 납입 카운트:</span>
              <span class="text-sm font-bold text-indigo-600 ml-1">${s.paidCount || 0} 회</span>
            </div>
            <button onclick="incrementSavingsPaid('${s.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl flex items-center shadow-sm">
              <i class="fa-solid fa-circle-check mr-1.5"></i>납입 완료 (O)
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function incrementSavingsPaid(savingsId) {
      const s = appData.savings.find(item => item.id === savingsId);
      if (s) {
        s.paidCount = (s.paidCount || 0) + 1;
        saveData();
        renderAll();
      }
    }

    function deleteSavings(savingsId) {
      if (confirm('적금을 삭제하시겠습니까? 연동된 미션도 함께 정돈됩니다.')) {
        appData.savings = appData.savings.filter(s => s.id !== savingsId);
        appData.missions = appData.missions.filter(m => m.savingsId !== savingsId);
        saveData();
        renderAll();
      }
    }

    // 3. 금융 달력 렌더링 & 연동 로직
    function renderCalendar() {
      document.getElementById('calendar-month-title').textContent = `${currentCalYear}년 ${currentCalMonth + 1}월`;
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const lastDate = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

      const combinedEvents = getCombinedEvents();

      // 빈 칸 생성
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'h-16 bg-gray-50/50 rounded-xl';
        grid.appendChild(empty);
      }

      // 날짜 생성
      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayEvents = combinedEvents.filter(e => e.date === dateStr);

        const isSelected = selectedCalDateStr === dateStr;

        const cell = document.createElement('div');
        cell.className = `h-16 p-1 rounded-xl border flex flex-col justify-between cursor-pointer transition ${
          isSelected ? 'border-indigo-600 bg-indigo-50/30' : 'border-gray-100 bg-white hover:border-gray-300'
        }`;
        cell.onclick = () => {
          selectedCalDateStr = dateStr;
          renderCalendar();
        };

        let dotsHtml = '';
        if (dayEvents.length > 0) {
          dotsHtml = `<div class="space-y-0.5 overflow-hidden">`;
          dayEvents.slice(0, 2).forEach(ev => {
            const colorClass = ev.type === 'income' ? 'bg-emerald-500' : (ev.isAuto ? 'bg-indigo-500' : 'bg-rose-500');
            dotsHtml += `<div class="text-[9px] truncate px-1 rounded text-white ${colorClass}">${ev.title}</div>`;
          });
          if (dayEvents.length > 2) {
            dotsHtml += `<div class="text-[8px] text-gray-400 font-bold text-center">+${dayEvents.length - 2}</div>`;
          }
          dotsHtml += `</div>`;
        }

        cell.innerHTML = `
          <div class="font-bold text-gray-700">${d}</div>
          ${dotsHtml}
        `;
        grid.appendChild(cell);
      }

      renderCalendarEventList(combinedEvents);
    }

    // 수동 일정 + 카드실적/적금이체/만기 자동 연동 생성 함수
    function getCombinedEvents() {
      const events = [...appData.calendarEvents];

      // 적금 자동이체 및 만기일 연동
      appData.savings.forEach(s => {
        // 1) 만기 연동 수입
        if (s.endDate) {
          events.push({
            id: `auto_mat_${s.id}`,
            date: s.endDate,
            title: `[만기 수령] ${s.title}`,
            amount: Number(s.amount) * (s.paidCount || 12),
            type: 'income',
            isAuto: true
          });
        }

        // 2) 매월 / 매주 적금 자동이체일 연동 (현재 달 기준)
        if (s.cycle === 'monthly' && s.payDay) {
          const targetDay = String(s.payDay).padStart(2, '0');
          const lastDayOfMon = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
          const validDay = Math.min(Number(targetDay), lastDayOfMon);
          const autoDateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(validDay).padStart(2, '0')}`;
          
          events.push({
            id: `auto_pay_${s.id}_${currentCalMonth}`,
            date: autoDateStr,
            title: `[적금 이체] ${s.title}`,
            amount: s.amount,
            type: 'expense',
            isAuto: true
          });
        }
      });

      return events;
    }

    function renderCalendarEventList(combinedEvents) {
      const container = document.getElementById('calendar-event-list');
      container.innerHTML = '';
      document.getElementById('selected-date-title').textContent = `${selectedCalDateStr} 금융 일정`;

      const dayEvents = combinedEvents.filter(e => e.date === selectedCalDateStr);

      if (dayEvents.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 py-3 text-center">선택한 날짜에 등록되거나 연동된 일정이 없습니다.</p>`;
        return;
      }

      dayEvents.forEach(e => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100 text-xs';
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-[10px] px-2 py-0.5 rounded font-bold ${e.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${e.type === 'income' ? '수입' : '지출/이체'}
            </span>
            <span class="font-bold text-gray-900">${e.title}</span>
            ${e.isAuto ? '<span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">자동연동</span>' : ''}
          </div>
          <div class="flex items-center space-x-2">
            <span class="font-bold ${e.type === 'income' ? 'text-emerald-600' : 'text-gray-800'}">
              ${e.amount ? Number(e.amount).toLocaleString() + '원' : ''}
            </span>
            ${!e.isAuto ? `
              <button onclick="openCalendarModal('${e.id}')" class="text-gray-400 hover:text-indigo-600 ml-1"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteCalendarEvent('${e.id}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
            ` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function changeMonth(delta) {
      currentCalMonth += delta;
      if (currentCalMonth < 0) {
        currentCalMonth = 11;
        currentCalYear--;
      } else if (currentCalMonth > 11) {
        currentCalMonth = 0;
        currentCalYear++;
      }
      renderCalendar();
    }

    function deleteCalendarEvent(id) {
      if (confirm('일정을 삭제하시겠습니까?')) {
        appData.calendarEvents = appData.calendarEvents.filter(e => e.id !== id);
        saveData();
        renderAll();
      }
    }

    // 4. 통장/자산 탭 렌더링
    function renderAccounts() {
      const container = document.getElementById('account-list');
      container.innerHTML = '';

      if (appData.accounts.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 py-6 text-center">등록된 통장이 없습니다.</p>`;
        return;
      }

      appData.accounts.forEach(a => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-3.5 bg-white rounded-2xl border border-gray-100 shadow-sm';
        item.innerHTML = `
          <div>
            <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-bold">${a.bank}</span>
            <h4 class="font-bold text-gray-900 text-xs mt-1">${a.name}</h4>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-bold text-indigo-600 text-sm">${Number(a.balance).toLocaleString()} 원</span>
            <button onclick="openAccountModal('${a.id}')" class="text-gray-400 hover:text-indigo-600 text-xs"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteAccount('${a.id}')" class="text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function deleteAccount(id) {
      if (confirm('계좌 정보를 삭제하시겠습니까?')) {
        appData.accounts = appData.accounts.filter(a => a.id !== id);
        saveData();
        renderAll();
      }
    }

    // 모달 및 폼 제출 핸들러들
    function openSavingsModal(id = null) {
      document.getElementById('form-savings').reset();
      document.getElementById('savings-id').value = '';
      document.getElementById('savings-modal-title').textContent = id ? '적금 수정' : '적금 등록';

      if (id) {
        const s = appData.savings.find(item => item.id === id);
        if (s) {
          document.getElementById('savings-id').value = s.id;
          document.getElementById('savings-title').value = s.title;
          document.getElementById('savings-amount').value = s.amount;
          document.getElementById('savings-start-date').value = s.startDate || '';
          document.getElementById('savings-end-date').value = s.endDate || '';
          document.getElementById('savings-cycle').value = s.cycle || 'monthly';
          toggleCycleInput();
          document.getElementById('savings-pay-day').value = s.payDay || '1';
          document.getElementById('savings-mission').value = s.mission || '';
        }
      } else {
        toggleCycleInput();
      }
      showModal('modal-savings');
    }

    function toggleCycleInput() {
      const cycle = document.getElementById('savings-cycle').value;
      const selectDay = document.getElementById('savings-pay-day');
      selectDay.innerHTML = '';

      if (cycle === 'monthly') {
        for (let i = 1; i <= 31; i++) {
          selectDay.innerHTML += `<option value="${i}">${i}일</option>`;
        }
      } else {
        const days = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
        days.forEach((d, idx) => {
          selectDay.innerHTML += `<option value="${idx}">${d}</option>`;
        });
      }
    }

    function saveSavings(e) {
      e.preventDefault();
      const id = document.getElementById('savings-id').value;
      const title = document.getElementById('savings-title').value;
      const amount = Number(document.getElementById('savings-amount').value);
      const startDate = document.getElementById('savings-start-date').value;
      const endDate = document.getElementById('savings-end-date').value;
      const cycle = document.getElementById('savings-cycle').value;
      const payDay = document.getElementById('savings-pay-day').value;
      const mission = document.getElementById('savings-mission').value;

      if (id) {
        const s = appData.savings.find(item => item.id === id);
        if (s) {
          s.title = title;
          s.amount = amount;
          s.startDate = startDate;
          s.endDate = endDate;
          s.cycle = cycle;
          s.payDay = payDay;
          s.mission = mission;
        }
      } else {
        const newId = 'sav_' + Date.now();
        appData.savings.push({ id: newId, title, amount, startDate, endDate, cycle, payDay, mission, paidCount: 0 });
        
        if (mission) {
          appData.missions.push({
            id: 'mis_' + Date.now(),
            savingsId: newId,
            title: `${title} 우대미션`,
            desc: mission,
            completed: false
          });
        }
      }

      saveData();
      closeModal('modal-savings');
      renderAll();
    }

    function openMissionModal(id = null) {
      const select = document.getElementById('mission-savings-id');
      select.innerHTML = appData.savings.map(s => `<option value="${s.id}">${s.title}</option>`).join('');

      document.getElementById('form-mission').reset();
      document.getElementById('mission-id').value = '';
      document.getElementById('mission-modal-title').textContent = id ? '우대금리 미션 수정' : '우대금리 미션 추가';

      if (id) {
        const m = appData.missions.find(item => item.id === id);
        if (m) {
          document.getElementById('mission-id').value = m.id;
          document.getElementById('mission-savings-id').value = m.savingsId;
          document.getElementById('mission-title').value = m.title;
          document.getElementById('mission-desc').value = m.desc || '';
        }
      }
      showModal('modal-mission');
    }

    function saveMission(e) {
      e.preventDefault();
      const id = document.getElementById('mission-id').value;
      const savingsId = document.getElementById('mission-savings-id').value;
      const title = document.getElementById('mission-title').value;
      const desc = document.getElementById('mission-desc').value;

      if (id) {
        const m = appData.missions.find(item => item.id === id);
        if (m) {
          m.savingsId = savingsId;
          m.title = title;
          m.desc = desc;
        }
      } else {
        appData.missions.push({ id: 'mis_' + Date.now(), savingsId, title, desc, completed: false });
      }

      saveData();
      closeModal('modal-mission');
      renderAll();
    }

    function openCalendarModal(id = null) {
      document.getElementById('form-calendar').reset();
      document.getElementById('calendar-event-id').value = '';
      document.getElementById('calendar-event-date').value = selectedCalDateStr;
      document.getElementById('calendar-modal-title').textContent = id ? '금융 일정 수정' : '금융 일정 추가';

      if (id) {
        const ev = appData.calendarEvents.find(item => item.id === id);
        if (ev) {
          document.getElementById('calendar-event-id').value = ev.id;
          document.getElementById('calendar-event-date').value = ev.date;
          document.getElementById('calendar-event-type').value = ev.type || 'expense';
          document.getElementById('calendar-event-title').value = ev.title;
          document.getElementById('calendar-event-amount').value = ev.amount || '';
        }
      }
      showModal('modal-calendar');
    }

    function saveCalendarEvent(e) {
      e.preventDefault();
      const id = document.getElementById('calendar-event-id').value;
      const date = document.getElementById('calendar-event-date').value;
      const type = document.getElementById('calendar-event-type').value;
      const title = document.getElementById('calendar-event-title').value;
      const amount = Number(document.getElementById('calendar-event-amount').value);

      if (id) {
        const ev = appData.calendarEvents.find(item => item.id === id);
        if (ev) {
          ev.date = date;
          ev.type = type;
          ev.title = title;
          ev.amount = amount;
        }
      } else {
        appData.calendarEvents.push({ id: 'evt_' + Date.now(), date, type, title, amount });
      }

      saveData();
      closeModal('modal-calendar');
      renderAll();
    }

    function openAccountModal(id = null) {
      document.getElementById('form-account').reset();
      document.getElementById('account-id').value = '';
      document.getElementById('account-modal-title').textContent = id ? '계좌 수정' : '계좌 등록';

      if (id) {
        const a = appData.accounts.find(item => item.id === id);
        if (a) {
          document.getElementById('account-id').value = a.id;
          document.getElementById('account-bank').value = a.bank;
          document.getElementById('account-name').value = a.name;
          document.getElementById('account-balance').value = a.balance;
        }
      }
      showModal('modal-account');
    }

    function saveAccount(e) {
      e.preventDefault();
      const id = document.getElementById('account-id').value;
      const bank = document.getElementById('account-bank').value;
      const name = document.getElementById('account-name').value;
      const balance = Number(document.getElementById('account-balance').value);

      if (id) {
        const a = appData.accounts.find(item => item.id === id);
        if (a) {
          a.bank = bank;
          a.name = name;
          a.balance = balance;
        }
      } else {
        appData.accounts.push({ id: 'acc_' + Date.now(), bank, name, balance });
      }

      saveData();
      closeModal('modal-account');
      renderAll();
    }

    // 유틸리티
    function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function getFormattedDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function getDayName(idx) {
      return ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'][idx] || '';
    }
  </script>
</body>
</html>
